# Place this file at: .github/workflows/build.yml
name: Build YTUHD (SIDELOAD)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build YTUHD (SIDELOAD=1)
    runs-on: macos-latest

    steps:
      - name: Checkout YTUHD (with libvpx + dav1d submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        # meson + ninja are required to build dav1d (per README)
        run: |
          brew install make ldid xz zstd meson ninja
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Set up Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install iOS SDK (from theos/sdks)
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Install PSHeader and YouTubeHeader
        run: |
          git clone --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          git clone --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"

      - name: Install libundirect header
        # Tweak.xm imports <libundirect/libundirect.h> unconditionally;
        # with SIDELOAD=1 the implementation comes from the bundled
        # libundirect_compact.m, but the header must still exist.
        run: |
          git clone --depth=1 https://github.com/opa334/libundirect.git /tmp/libundirect
          mkdir -p "$THEOS/include/libundirect"
          cp -v /tmp/libundirect/libundirect.h \
                /tmp/libundirect/libundirect_dynamic.h \
                /tmp/libundirect/libundirect_hookoverwrite.h \
                "$THEOS/include/libundirect/"

      - name: Get vendor submodule revisions (for cache key)
        id: vendor-rev
        run: echo "rev=$(git rev-parse HEAD:vendor/libvpx)-$(git rev-parse HEAD:vendor/dav1d)" >> $GITHUB_OUTPUT

      - name: Cache libvpx and dav1d static libraries
        uses: actions/cache@v4
        with:
          path: |
            vendor/libvpx_ios
            vendor/dav1d_ios
          key: vendor-libs-${{ runner.os }}-${{ steps.vendor-rev.outputs.rev }}-${{ hashFiles('vendor/build_libvpx.sh', 'vendor/build_dav1d.sh') }}

      - name: Build YTUHD (SIDELOAD=1)
        # libvpx.a and libdav1d.a are built automatically by the Makefile
        # on first run (or restored from cache on later runs).
        run: make clean package FINALPACKAGE=1 SIDELOAD=1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YTUHD-sideload
          path: |
            packages/*.deb
            .theos/obj/YTUHD.dylib
          if-no-files-found: error
